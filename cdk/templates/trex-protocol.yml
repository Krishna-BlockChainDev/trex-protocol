kind: fargate-stack
stackName: trex-protocol-dev
env:
  account: ''
  region: ap-southeast-2
target:
  vpcId:
  securityGroupId:
  clusterName: bwav-staging-cluster
service:
  container:
    repositoryName: trex-protocol
    tag: 'latest'
  desiredCount: 1
  containerPort: 3000
  environment:
    PORT: '3000'
    NO_COLOR: 'true'
    NEXT_TELEMETRY_DISABLED: '1'
    BSC_TESTNET_RPC_URL: 'https://data-seed-prebsc-1-s1.binance.org:8545'
  secret:
    secretArn: '***REMOVED***'
    secretNames:
      - ISSUER_PRIVATE_KEY
      - SEPOLIA_RPC_URL
      - MAINNET_RPC_URL
      - WALLETCONNECT_PROJECT_ID
  loadBalancer:
    enabled: true
    certificateArn:
    host:
    cloudFrontSecret: '***REMOVED***'
    defaultHealthCheck: '/v1/health-check'
    targetGroups:
      - name: 'catch-all'
        prefix: '/*'
  securityGroupRules:
    enabled: true
    peers:
      - securityGroupId:
        port: 5432
        name: aurora
